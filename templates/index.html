<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p>Get real-time weather information</p>
        </div>
        
        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..." 
                autocomplete="off"
            >
            <button id="searchBtn">Search</button>
        </div>
        
        <div id="loadingSpinner" class="spinner" style="display: none;"></div>
        
        <div id="errorMessage" class="error" style="display: none;"></div>
        
        <div id="weatherCard" class="weather-card" style="display: none;">
            <div class="weather-header">
                <div class="location">
                    <h2 id="cityName"></h2>
                    <p id="countryCode"></p>
                </div>
                <div class="weather-icon">
                    <img id="weatherIcon" src="" alt="Weather icon">
                </div>
            </div>
            
            <div class="weather-description">
                <p id="description"></p>
            </div>
            
            <div class="temperature-section">
                <div class="main-temp">
                    <span id="temperature"></span>
                    <span class="unit">°C</span>
                </div>
                <p id="feelsLike" class="feels-like"></p>
            </div>
            
            <div class="weather-details">
                <div class="detail-item">
                    <span class="label">Humidity</span>
                    <span id="humidity" class="value"></span>
                </div>
                <div class="detail-item">
                    <span class="label">Wind Speed</span>
                    <span id="windSpeed" class="value"></span>
                </div>
                <div class="detail-item">
                    <span class="label">Pressure</span>
                    <span id="pressure" class="value"></span>
                </div>
            </div>
        </div>
        
        <div id="welcomeMessage" class="welcome">
            <p>👋 Welcome! Enter a city name to get started.</p>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
